<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Kids</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="container py-4">

    <!-- Header with the cart toggle button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>{{ siteName }}</h1>
      <!-- NEW: toggle button, only enabled when the cart has at least 1 item -->
      <button class="btn btn-success" v-on:click="toggleCart" :disabled="cart.length === 0">
        {{ showCart ? 'Back to Lessons' : 'Cart (' + cart.length + ')' }}
      </button>
    </div>

    <!-- ==================== LESSONS PAGE ==================== -->
    <div v-if="!showCart">
      <!-- Sort controls -->
      <div class="row mb-4">
        <div class="col-md-3">
          <label class="form-label">Sort by</label>
          <select class="form-select" v-model="sortBy">
            <option value="topic">Subject</option>
            <option value="location">Location</option>
            <option value="price">Price</option>
            <option value="space">Spaces</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Order</label>
          <select class="form-select" v-model="sortOrder">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>
      </div>

      <!-- Lesson list -->
      <div class="row">
        <div class="col-md-4 mb-4" v-for="lesson in sortedLessons" :key="lesson._id">
          <div class="card h-100">
            <img :src="apiUrl + '/images/' + lesson.image" class="card-img-top" :alt="lesson.topic"
                 style="height: 180px; object-fit: cover;">
            <div class="card-body">
              <h5 class="card-title">{{ lesson.topic }}</h5>
              <p class="mb-1"><strong>Subject:</strong> {{ lesson.topic }}</p>
              <p class="mb-1"><strong>Location:</strong> {{ lesson.location }}</p>
              <p class="mb-1"><strong>Price:</strong> Rs {{ lesson.price }}</p>
              <p class="mb-1"><strong>Spaces:</strong> {{ lesson.space }}</p>
            </div>
            <div class="card-footer">
              <button class="btn btn-primary w-100"
                      v-on:click="addToCart(lesson)"
                      :disabled="lesson.space === 0">
                Add to Cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== CART PAGE (NEW) ==================== -->
    <div v-else>
      <h2 class="mb-3">Shopping Cart</h2>

      <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between align-items-center"
            v-for="(item, index) in cartItems" :key="index">
          <div class="d-flex align-items-center">
            <img :src="apiUrl + '/images/' + item.image" :alt="item.topic"
                 style="width: 60px; height: 60px; object-fit: cover;" class="me-3 rounded">
            <div>
              <strong>{{ item.topic }}</strong><br>
              {{ item.location }} · Rs {{ item.price }}
            </div>
          </div>
          <button class="btn btn-outline-danger btn-sm" v-on:click="removeFromCart(index)">
            Remove
          </button>
        </li>
      </ul>

      <!-- Checkout will go here in Step 13 -->
    </div>

  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          siteName: 'Active Kids',
          apiUrl: 'https://m01034342-active-kids.onrender.com',
          lessons: [],
          sortBy: 'topic',
          sortOrder: 'asc',
          cart: [],
          showCart: false      // NEW: false = lessons page, true = cart page
        };
      },
      computed: {
        sortedLessons() {
          const key = this.sortBy;
          const direction = this.sortOrder === 'asc' ? 1 : -1;

          return [...this.lessons].sort((a, b) => {
            if (a[key] > b[key]) return direction;
            if (a[key] < b[key]) return -direction;
            return 0;
          });
        },
        // NEW: turns the list of ids in the cart into full lesson objects
        cartItems() {
          return this.cart.map(id => this.lessons.find(lesson => lesson._id === id));
        }
      },
      methods: {
        addToCart(lesson) {
          if (lesson.space > 0) {
            this.cart.push(lesson._id);
            lesson.space--;
          }
        },
        // NEW: switch between the lessons page and the cart page
        toggleCart() {
          this.showCart = !this.showCart;
        },
        // NEW: remove one item from the cart and give its space back to the lesson
        removeFromCart(index) {
          const id = this.cart[index];
          const lesson = this.lessons.find(lesson => lesson._id === id);
          lesson.space++;
          this.cart.splice(index, 1);

          if (this.cart.length === 0) {
            this.showCart = false;
          }
        }
      },
      mounted() {
        fetch(this.apiUrl + '/lessons')
          .then(response => response.json())
          .then(data => {
            this.lessons = data;
          })
          .catch(error => console.error('Could not load lessons:', error));
      }
    }).mount('#app');
  </script>
</body>
</html>
